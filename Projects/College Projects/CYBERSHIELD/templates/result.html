<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .container {
            margin-top: 100px;
            text-align: center;
        }

        .box {
            width: 420px;
            margin: auto;
            padding: 30px;
            background: rgba(17,17,17,0.92);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }

        /* 🔥 FIXED NEON BORDER */
        .box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 15px;
            padding: 2px;

            background: linear-gradient(270deg, cyan, blue, purple, cyan);
            background-size: 400% 400%;
            animation: borderMove 4s linear infinite;

            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;

            pointer-events: none; /* 🔥 FIX */
        }

        @keyframes borderMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        h1 {
            text-shadow: 0 0 10px cyan;
        }

        .result-text {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 1px;
        }

        /* 🎯 RESULT COLORS */
        .safe {
            color: lime;
            text-shadow: 0 0 15px lime;
        }

        .medium {
            color: orange;
            text-shadow: 0 0 15px orange;
        }

        .danger {
            color: red;
            text-shadow: 0 0 15px red;
        }

        p {
            color: #ccc;
            margin-top: 10px;
        }

        /* 🔘 BUTTONS */
        .btns {
            margin-top: 25px;
            position: relative;
            z-index: 2;
        }

        .btns button {
            margin: 8px;
            padding: 10px 18px;
            border: 1px solid cyan;
            background: rgba(0,0,0,0.7);
            color: cyan;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btns button:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 10px cyan;
        }
    </style>
</head>

<!-- 🎯 OPTIONAL: dynamic background -->
<body class="
{% if result == 'Safe' or result == 'Suspicious' or result == 'Dangerous' %}
    url-page
{% else %}
    password-page
{% endif %}
">

<!-- 🔝 NAVBAR -->
<div class="navbar">
    <a href="/">Home</a>
    <a href="/url">URL Checker</a>
    <a href="/password">Password</a>
    <a href="/awareness">Awareness</a>
</div>

<div class="container">
    <div class="box">

        <h1>🔍 Analysis Result</h1>

        <!-- 🎯 RESULT TEXT -->
        <div class="result-text
            {% if result == 'Safe' or result == 'Strong' %}
                safe
            {% elif result == 'Suspicious' or result == 'Medium' %}
                medium
            {% else %}
                danger
            {% endif %}
        ">
            {{ result }}
        </div>

        <!-- 💡 SUGGESTION -->
        <p>{{ suggestion }}</p>

        <!-- 🔘 BUTTONS -->
        <div class="btns">
            <a href="/"><button>🏠 Home</button></a>
            <a href="/url"><button>🔍 Check URL</button></a>
            <a href="/password"><button>🔐 Check Password</button></a>
        </div>

    </div>
</div>

</body>
</html>

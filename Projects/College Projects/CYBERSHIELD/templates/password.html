<!DOCTYPE html>
<html>
<head>
    <title>PASSWORD STRENGTH ANALYZER</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .container {
            margin-top: 100px;
            text-align: center;
        }

        .box {
            width: 420px;
            margin: auto;
            padding: 30px;
            background: rgba(17,17,17,0.92);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }

        /* 🔥 GLOWING BORDER */
        .box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 15px;
            padding: 2px;
            background: linear-gradient(270deg, cyan, blue, purple, cyan);
            background-size: 400% 400%;
            animation: borderMove 4s linear infinite;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes borderMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        h1 {
            text-shadow: 0 0 10px cyan;
        }

        #resultBox {
            margin-top: 25px;
        }

        .loading {
            color: cyan;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        /* PASSWORD INPUT + EYE BUTTON */
        .input-group {
            position: relative;
            width: 80%;
            margin: auto;
        }

        .input-group input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border-radius: 50px;
            border: 2px solid cyan;  /* cyan border */
            outline: none;
            font-size: 16px;
            background: rgba(0,0,0,0.4);
            color: #fff;
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .toggle-btn svg {
            fill: cyan;
            width: 24px;
            height: 24px;
            transition: fill 0.3s;
        }

        .toggle-btn:hover svg {
            fill: #0ff;
        }

        /* BUTTONS */
        button {
            padding: 10px 25px;
            margin: 10px 5px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            background: cyan;
            color: #000;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #0ff;
            color: #000;
        }

        .safe { color: #00ff7f; font-size: 22px; }
        .medium { color: #ffd700; font-size: 22px; }
        .danger { color: #ff4500; font-size: 22px; }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 15px;
            background: #111;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar a {
            color: cyan;
            text-decoration: none;
            font-weight: 500;
        }

        .navbar a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="password-page">

<div class="navbar">
    <a href="/">Home</a>
    <a href="/url">URL Checker</a>
    <a href="/password">Password</a>
    <a href="/awareness">Awareness</a>
</div>

<div class="container">
    <div class="box">
        <h1>🔐 Password Strength Checker</h1>

        <!-- PASSWORD INPUT WITH EYE -->
        <div class="input-group">
            <input type="password" id="passwordInput" placeholder="Enter Password" required>
            <span class="toggle-btn" onclick="togglePassword()">
                <svg id="eyeIcon" viewBox="0 0 24 24">
                    <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5
                             5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"/>
                </svg>
            </span>
        </div>

        <br>

        <!-- SAME BUTTONS -->
        <button onclick="checkPassword()">Analyze</button>
        <button onclick="clearResult()">Clear</button>

        <div id="resultBox"></div>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById("passwordInput");
    const eye = document.getElementById("eyeIcon");

    if (input.type === "password") {
        input.type = "text";
        // Eye-off icon
        eye.innerHTML = `<path d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7 1.61 0 3.11-.39 4.42-1.08l-1.34-1.34A4.96 4.96 0 0112 17c-2.76 0-5-2.24-5-5
                          0-1.16.42-2.22 1.11-3.03l-1.45-1.45C4.63 7.81 3 9.76 3 12s3.27 7 9 7c1.61 0 3.11-.39 4.42-1.08l1.34 1.34C18.89 18.11 15 5 12 5z"/>`;
    } else {
        input.type = "password";
        // Eye-open icon
        eye.innerHTML = `<path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5
                          5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"/>`;
    }
}

function checkPassword() {
    const password = document.getElementById("passwordInput").value;
    if (!password) {
        alert("Please enter a password");
        return;
    }

    const resultBox = document.getElementById("resultBox");
    resultBox.innerHTML = "<p class='loading'>Analyzing...</p>";

    fetch('/check_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'password=' + encodeURIComponent(password)
    })
    .then(res => res.json())
    .then(data => {
        let colorClass = data.result === "Strong" ? "safe" :
                         data.result === "Medium" ? "medium" : "danger";

        resultBox.innerHTML = `
            <h2 class="${colorClass}">${data.result}</h2>
            <p>${data.suggestion}</p>
        `;
    })
    .catch(() => {
        resultBox.innerHTML = "<p style='color:red;'>Error analyzing password</p>";
    });
}

function clearResult() {
    document.getElementById("passwordInput").value = "";
    document.getElementById("resultBox").innerHTML = "";
}
</script>

</body>
</html>
